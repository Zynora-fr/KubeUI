# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true

# Environment Properties
# The Minecraft version must agree with the NeoForge version to get a valid artifact.
# KubeJS only ships NeoForge builds from Minecraft 1.21.1 onward, so KubeUI targets
# NeoForge exclusively - see README.md for why Fabric/Forge are not supported.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neoforge_version=26.1.2.84
neoforge_version_range=[26.1.2.84,)
loader_version_range=[2,)

# KubeJS (the mod KubeUI is an addon for)
# groupId: dev.latvian.mods, artifactId: kubejs-neoforge, repo: https://maven.latvian.dev/releases
kubejs_version=26.1.2-8.0.4
kubejs_mod_version_range=[8.0,)

## Mod Properties
mod_id=kubeui
mod_name=KubeUI
mod_license=MIT
mod_version=0.3.0
mod_group_id=dev.kubeui
mod_authors=Zynora
mod_description=Build interactive, widget-based graphical user interfaces from KubeJS scripts.
