name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubeui-jar
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/**/*.xml
          if-no-files-found: ignore

  boot-test:
    name: Dev client boot check (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Install Xvfb (virtual display for LWJGL)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # runClient starts an actual game client and never exits on its own, so this is capped with
      # `timeout` (expected to be killed - that's not a failure) and the log is inspected for a
      # crash report instead. This is a regression test for exactly the kind of issue this project
      # hit during development (a mixin/refmap crash from a JarJar-embedded KubeJS dependency) -
      # see README.md's "Running in a dev environment" section.
      - name: Boot the dev client and check for a crash
        run: |
          xvfb-run --auto-servernum timeout 180 ./gradlew runClient --console=plain > runclient.log 2>&1 || true

          if grep -q "Game crashed" runclient.log; then
            echo "::error::Dev client crashed on boot - see the uploaded log"
            tail -n 200 runclient.log
            exit 1
          fi

          if ! grep -q "KubeJS Client/" runclient.log; then
            echo "::error::KubeJS client scripts never loaded - mod/plugin registration is likely broken"
            tail -n 200 runclient.log
            exit 1
          fi

          echo "Boot check passed - no crash report, KubeJS client scripts loaded."

      - name: Upload client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runclient-log
          path: runclient.log
          if-no-files-found: ignore
