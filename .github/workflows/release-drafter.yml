name: Release Drafter

# Keeps a draft GitHub release up to date with every merge to main, grouping merged PRs into
# categories by label (see .github/release-drafter.yml) - so writing the release-facing changelog
# is "label your PRs" instead of a separate manual pass. Publishing the draft itself is still a
# deliberate manual click (Releases > the draft > Publish), never automatic.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  update-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
