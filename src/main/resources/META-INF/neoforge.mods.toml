modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Zynora-fr/KubeUI/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "kubeui_logo.png"
# curseupdate.com maps our CurseForge project (id 1635257) to the Forge/NeoForge update-checker
# JSON format - no CurseForge API key needed (their own Core API requires one; this doesn't).
# NeoForge's VersionChecker (net.neoforged.fml.VersionChecker) fetches and caches this
# automatically at FMLCommonSetupEvent, once per game launch - see KubeUIUpdateChecker, which
# reads the cached result to tell the player in chat when they join a world.
updateJSONURL = "https://neoforge.curseupdate.com/1635257/${mod_id}"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "kubejs"
type = "required"
versionRange = "${kubejs_mod_version_range}"
ordering = "AFTER"
side = "CLIENT"
